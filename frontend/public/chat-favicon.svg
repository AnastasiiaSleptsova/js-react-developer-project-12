<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Hexlet Chat</title>
  <desc id="desc">Rounded square with chat bubble and three dots</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#0f62fe" offset="0%"/>
      <stop stop-color="#0b4ac9" offset="100%"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#ffffff" stop-opacity="0.98" offset="0%"/>
      <stop stop-color="#e8f0ff" stop-opacity="0.98" offset="100%"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Chat bubble -->
  <path
    d="M16 18c0-2.2 1.8-4 4-4h24c2.2 0 4 1.8 4 4v14c0 2.2-1.8 4-4 4H30l-6 6c-1.3 1.3-3.6 0.38-3.6-1.46V36h-0.4c-2.2 0-4-1.8-4-4V18Z"
    fill="url(#bubble)"/>

  <!-- Dots -->
  <circle cx="24" cy="26" r="2.8" fill="#0f62fe"/>
  <circle cx="32" cy="26" r="2.8" fill="#0f62fe"/>
  <circle cx="40" cy="26" r="2.8" fill="#0f62fe"/>
</svg>
